# =========================
# Hyprland (fwbook)
# =========================
# Mirrors the niri setup in configs/niri, adapted to Hyprland's native
# scrolling layout + the noctalia shell. This directory is symlinked to
# ~/.config/hypr by the skyg hyprland module
# (skyg.nixos.desktop.tiler.hyprland), defaulting to configs/${hostName}/hypr.

# =========================
# Variables
# =========================
$mainMod = SUPER
$terminal = ghostty
$browser = chromium
$fileManager = nautilus

# =========================
# Sourced configuration
# =========================
source = ~/.config/hypr/hyprland.d/env.conf
source = ~/.config/hypr/hyprland.d/general.conf
source = ~/.config/hypr/hyprland.d/monitors.conf
source = ~/.config/hypr/hyprland.d/inputs.conf
source = ~/.config/hypr/hyprland.d/window-rules.conf
source = ~/.config/hypr/hyprland.d/keybindings.conf
source = ~/.config/hypr/hyprland.d/autostart.conf
