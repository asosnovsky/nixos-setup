# =========================
# xdg-desktop-portal-hyprland (fwbook)
# =========================
# Read by xdph itself from ~/.config/hypr/xdph.conf (hyprlang format, not Lua),
# so it is not require()'d from hyprland.lua. This directory is symlinked to
# ~/.config/hypr by the skyg hyprland module.
#
# force_shm: skip DMA-BUF buffer negotiation for screencast. xdph fails modifier
# fixation on this machine ("DMA-BUF fixation failed after 2 attempts") and tears
# the stream down; Chromium then reopens a ScreenCast session, which re-shows the
# output picker. Capture already ended up on SHM via the fallback path anyway, so
# image quality is unchanged -- this just avoids the failing negotiation and the
# teardown it causes.
#
# Deliberately NOT setting screencopy:allow_token_by_default -- it would auto-grant
# restore tokens to any app that asks, letting it silently re-capture later. Tick
# "allow restore token" in the picker instead.

screencopy {
    force_shm = true
}
