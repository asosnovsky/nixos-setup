# =========================
# Keybindings
# =========================
# Mirrors configs/niri/shared/binds.kdl and configs/niri/noctalia/binds.kdl,
# adapted to Hyprland's scrolling-layout dispatchers (layoutmsg ...).

$mainMod = SUPER

# =========================
# General / Apps
# =========================
# niri: Mod+Shift+H show-hotkey-overlay — no native Hyprland equivalent.
# bind = $mainMod SHIFT, H, exec, <hotkey overlay tool>
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, wofi-emoji
bind = $mainMod, Q, killactive

# =========================
# Navigation
# =========================
bind = $mainMod, Left,  movefocus, l
bind = $mainMod, Right, movefocus, r
# niri workspaces are vertical stacks; map Up/Down to workspace switching.
bind = $mainMod, Up,    workspace, e-1
bind = $mainMod, Down,  workspace, e+1

# niri: toggle-overview — no native Hyprland overview (and no maintained plugin
# that builds against current Hyprland), so fall back to cycling windows.
bind = $mainMod, Tab, cyclenext
# niri: focus-monitor-next
bind = $mainMod SHIFT, Tab, focusmonitor, +1

# =========================
# Window Management
# =========================
# niri swap-window-left/right -> scrolling swapcol
bind = $mainMod CTRL, Right, layoutmsg, swapcol r
bind = $mainMod CTRL, Left,  layoutmsg, swapcol l
# niri move-window-to-workspace-up/down
bind = $mainMod CTRL, Up,   movetoworkspace, e-1
bind = $mainMod CTRL, Down, movetoworkspace, e+1

# niri: toggle-column-tabbed-display (closest: group/tab windows together)
bind = $mainMod, W, togglegroup
# niri: maximize-column (fill screen, keep bar)
bind = $mainMod, F, fullscreen, 1
# niri: fullscreen-window (true fullscreen)
bind = $mainMod SHIFT, F, fullscreen, 0
# niri: reset-window-height (scrolling has no per-window height; refit column)
bind = $mainMod CTRL, F, layoutmsg, fit_into_view
# niri: toggle-window-floating
bind = $mainMod, V, togglefloating
# niri: center-column (recenter focused column in view)
bind = $mainMod, C, layoutmsg, focus current

# =========================
# Resizing
# =========================
# niri set-column-width -/+10%  ->  scrolling colresize
bind = $mainMod, Minus, layoutmsg, colresize -0.1
bind = $mainMod, Equal, layoutmsg, colresize +0.1
# niri set-window-height -/+10%
bind = $mainMod SHIFT, Minus, resizeactive, 0 -10%
bind = $mainMod SHIFT, Equal, resizeactive, 0 +10%

# =========================
# Screenshots & Recording
# =========================
bind = , Print, exec, grim -g "$(slurp)" - | satty -f -
bind = $mainMod, P, exec, grim -g "$(slurp)" - | satty -f -
bind = $mainMod, R, exec, ~/.config/hypr/screen-record.sh

# =========================
# Session
# =========================
# niri: Mod+Escape toggle-keyboard-shortcuts-inhibit — no native equivalent.
bind = CTRL ALT, Delete, exit

# =========================
# Monitor Movement
# =========================
# niri move-column-to-monitor-{down,left,right,up}
bind = $mainMod ALT, Down,  movewindow, mon:d
bind = $mainMod ALT, Left,  movewindow, mon:l
bind = $mainMod ALT, Right, movewindow, mon:r
bind = $mainMod ALT, Up,    movewindow, mon:u

# niri moved workspaces between monitors via touchpad scroll; approximate with
# Mod + mouse wheel (move current workspace to next/prev monitor).
bind = $mainMod, mouse_down, movecurrentworkspacetomonitor, +1
bind = $mainMod, mouse_up,   movecurrentworkspacetomonitor, -1

# =========================
# Mouse drag (move / resize windows)
# =========================
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =========================
# Noctalia shell (mirrors configs/niri/noctalia/binds.kdl)
# =========================
bind = $mainMod, Space, exec, noctalia-shell ipc call launcher toggle
bind = $mainMod, S, exec, noctalia-shell ipc call controlCenter toggle
bind = $mainMod, Comma, exec, noctalia-shell ipc call settings toggle

# Clipboard history
bind = $mainMod ALT, P, exec, rofi -modi "clipboard:greenclip print" -show clipboard
# Dismiss all notifications
bind = $mainMod ALT, L, exec, noctalia-shell ipc call notifications dismissAll

# Media & brightness
bind = $mainMod SHIFT, Up,    exec, noctalia-shell ipc call volume increase
bind = $mainMod SHIFT, Down,  exec, noctalia-shell ipc call volume decrease
bind = $mainMod SHIFT, Right, exec, playerctl next
bind = $mainMod SHIFT, Left,  exec, playerctl previous
bind = $mainMod SHIFT, Space, exec, playerctl play-pause

bindl = , XF86AudioRaiseVolume,  exec, noctalia-shell ipc call volume increase
bindl = , XF86AudioLowerVolume,  exec, noctalia-shell ipc call volume decrease
bindl = , XF86AudioMute,         exec, noctalia-shell ipc call volume muteOutput
bindl = , XF86MonBrightnessUp,   exec, noctalia-shell ipc call brightness increase
bindl = , XF86MonBrightnessDown, exec, noctalia-shell ipc call brightness decrease
